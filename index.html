<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas 飛機</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #000;
      cursor: crosshair;
    }

    #musicBtn {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 20;
      padding: 10px 16px;
      color: #fff;
      background: rgba(10, 18, 30, 0.72);
      border: 1px solid rgba(120, 200, 255, 0.5);
      border-radius: 999px;
      font: 600 14px/1 system-ui, sans-serif;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }

    #musicBtn:hover {
      background: rgba(20, 40, 60, 0.9);
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <button id="musicBtn" type="button" aria-label="播放或靜音背景音樂">▶ 播放 BGM</button>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // 原創「東方風」8-bit BGM（Web Audio 合成，不使用受版權保護的旋律）
    const musicBtn = document.getElementById('musicBtn');
    const BPM = 156;
    const STEP_TIME = 60 / BPM / 4;

    // 4 小節、A 小調 / 和聲小調風格的原創旋律
    const LEAD_NOTES = [
      76, 81, 79, 76, 72, 74, 76, 72,
      77, 81, 79, 77, 72, 74, 76, 72,
      79, 84, 83, 79, 76, 74, 72, 74,
      80, 83, 86, 83, 80, 79, 77, 76
    ];
    const BASS_ROOTS = [45, 41, 48, 40];
    const ARP_CHORDS = [
      [69, 72, 76, 81],
      [65, 69, 72, 77],
      [72, 76, 79, 84],
      [64, 68, 71, 76]
    ];

    // Stage 2：D 小調 / 和聲小調風格的原創旋律
    const LEAD_NOTES_2 = [
      74, 77, 81, 86, 84, 81, 77, 74,
      70, 74, 77, 82, 81, 77, 74, 70,
      72, 77, 81, 84, 82, 81, 77, 72,
      73, 76, 81, 85, 84, 81, 76, 73
    ];
    const BASS_ROOTS_2 = [38, 34, 41, 33];
    const ARP_CHORDS_2 = [
      [62, 65, 69, 74],
      [58, 62, 65, 70],
      [60, 65, 69, 72],
      [61, 64, 69, 73]
    ];

    let audioCtx = null;
    let musicGain = null;
    let noiseBuffer = null;
    let musicTimer = null;
    let musicStarted = false;
    let musicMuted = false;
    let musicStep = 0;
    let nextNoteTime = 0;
    let musicTrack = 1;

    const noteFreq = (note) => 440 * Math.pow(2, (note - 69) / 12);

    function updateMusicButton() {
      if (!musicStarted) {
        musicBtn.textContent = '▶ 播放 BGM';
      } else if (musicMuted) {
        musicBtn.textContent = '🔇 已靜音';
      } else {
        musicBtn.textContent = `🔊 東方風 BGM · S${musicTrack}`;
      }
    }

    function setMusicTrack(track) {
      musicTrack = track;
      musicStep = 0;
      if (audioCtx) nextNoteTime = audioCtx.currentTime + 0.05;
      updateMusicButton();
    }

    function initAudio() {
      if (audioCtx) return;
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) throw new Error('Web Audio not supported');

      audioCtx = new AudioContextClass();
      const compressor = audioCtx.createDynamicsCompressor();
      musicGain = audioCtx.createGain();
      musicGain.gain.value = 0;
      musicGain.connect(compressor);
      compressor.connect(audioCtx.destination);

      noiseBuffer = audioCtx.createBuffer(
        1,
        audioCtx.sampleRate * 0.5,
        audioCtx.sampleRate
      );
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < data.length; i += 1) {
        data[i] = Math.random() * 2 - 1;
      }
    }

    function tone(freq, time, duration, type, volume, cutoff) {
      const osc = audioCtx.createOscillator();
      const amp = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();

      osc.type = type;
      osc.frequency.setValueAtTime(freq, time);
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(cutoff || 4000, time);

      amp.gain.setValueAtTime(0.0001, time);
      amp.gain.exponentialRampToValueAtTime(volume, time + 0.008);
      amp.gain.exponentialRampToValueAtTime(0.0001, time + duration);

      osc.connect(filter);
      filter.connect(amp);
      amp.connect(musicGain);
      osc.start(time);
      osc.stop(time + duration + 0.03);
    }

    function noise(time, duration, volume, highpass) {
      const source = audioCtx.createBufferSource();
      const filter = audioCtx.createBiquadFilter();
      const amp = audioCtx.createGain();

      source.buffer = noiseBuffer;
      filter.type = 'highpass';
      filter.frequency.value = highpass;
      amp.gain.setValueAtTime(volume, time);
      amp.gain.exponentialRampToValueAtTime(0.0001, time + duration);

      source.connect(filter);
      filter.connect(amp);
      amp.connect(musicGain);
      source.start(time);
      source.stop(time + duration);
    }

    function kick(time) {
      const osc = audioCtx.createOscillator();
      const amp = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(150, time);
      osc.frequency.exponentialRampToValueAtTime(45, time + 0.11);
      amp.gain.setValueAtTime(0.09, time);
      amp.gain.exponentialRampToValueAtTime(0.0001, time + 0.14);

      osc.connect(amp);
      amp.connect(musicGain);
      osc.start(time);
      osc.stop(time + 0.16);
    }

    function playStep(step, time) {
      const bar = Math.floor(step / 16) % 4;
      const barStep = step % 16;
      const lead = musicTrack === 2 ? LEAD_NOTES_2 : LEAD_NOTES;
      const bassRoots = musicTrack === 2 ? BASS_ROOTS_2 : BASS_ROOTS;
      const arpChords = musicTrack === 2 ? ARP_CHORDS_2 : ARP_CHORDS;

      // 主旋律（八分音符）
      if (step % 2 === 0) {
        tone(noteFreq(lead[step / 2]), time, 0.13, 'square', 0.035, 3600);
      }

      // 低音
      if (step % 4 === 0) {
        const root = bassRoots[bar];
        const note = step % 8 === 0 ? root : root + 12;
        tone(noteFreq(note), time, 0.23, 'triangle', 0.075, 900);
      }

      // 快速琶音
      if (step % 2 === 1) {
        const chord = arpChords[bar];
        const note = chord[Math.floor((barStep - 1) / 2) % 4];
        tone(noteFreq(note), time, 0.07, 'square', 0.012, 5200);
      }

      // 節奏組
      if (barStep === 0 || barStep === 6 || barStep === 8 || barStep === 14) {
        kick(time);
      }
      if (barStep === 4 || barStep === 12) {
        noise(time, 0.09, 0.035, 1500);
      }
      if (step % 2 === 0) {
        noise(time, 0.025, 0.008, 7000);
      }
    }

    function scheduleMusic() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      if (nextNoteTime < now - 0.5) nextNoteTime = now + 0.05;

      while (nextNoteTime < now + 0.18) {
        playStep(musicStep, nextNoteTime);
        nextNoteTime += STEP_TIME;
        musicStep = (musicStep + 1) % 64;
      }
    }

    async function toggleMusic() {
      try {
        initAudio();
        await audioCtx.resume();
      } catch (error) {
        musicBtn.textContent = '⚠ 瀏覽器不支援音訊';
        return;
      }

      if (!musicStarted) {
        musicStarted = true;
        musicMuted = false;
        musicStep = 0;
        nextNoteTime = audioCtx.currentTime + 0.05;
        musicGain.gain.setTargetAtTime(0.22, audioCtx.currentTime, 0.1);
        if (!musicTimer) musicTimer = setInterval(scheduleMusic, 25);
      } else {
        musicMuted = !musicMuted;
        musicGain.gain.setTargetAtTime(
          musicMuted ? 0 : 0.22,
          audioCtx.currentTime,
          0.05
        );
      }

      updateMusicButton();
    }

    musicBtn.addEventListener('click', toggleMusic);
    updateMusicButton();

    // 星空背景圖（可替換成自己的圖片網址）
    const STARFIELD_URL = 'https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?auto=format&fit=crop&w=1600&q=80';
    const starfield = new Image();
    let starfieldReady = false;
    let backgroundOffset = 0;
    const BACKGROUND_SPEED = 90;

    const fallbackStars = Array.from({ length: 140 }, () => ({
      x: Math.random(),
      y: Math.random(),
      size: 0.6 + Math.random() * 1.8,
      speed: 0.4 + Math.random() * 1.6,
      alpha: 0.35 + Math.random() * 0.65
    }));

    starfield.onload = () => {
      starfieldReady = true;
      draw();
    };
    starfield.onerror = () => {
      starfieldReady = false;
    };
    starfield.src = STARFIELD_URL;

    function updateBackground(dt) {
      backgroundOffset = (backgroundOffset + BACKGROUND_SPEED * dt) % 100000;
    }

    function drawBackground() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, width, height);

      if (starfieldReady && starfield.naturalWidth > 0) {
        const scale = Math.max(
          width / starfield.naturalWidth,
          height / starfield.naturalHeight
        );
        const drawWidth = starfield.naturalWidth * scale;
        const drawHeight = starfield.naturalHeight * scale;
        const drawX = (width - drawWidth) / 2;
        const scrollY = backgroundOffset % drawHeight;

        ctx.globalAlpha = 0.9;
        ctx.drawImage(starfield, drawX, scrollY - drawHeight, drawWidth, drawHeight);
        ctx.drawImage(starfield, drawX, scrollY, drawWidth, drawHeight);
        ctx.globalAlpha = 1;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.32)';
        ctx.fillRect(0, 0, width, height);
        return;
      }

      // 圖片載入失敗時的星空備援
      ctx.fillStyle = '#02040a';
      ctx.fillRect(0, 0, width, height);
      for (const star of fallbackStars) {
        const y =
          ((star.y * height + backgroundOffset * star.speed) % height + height) %
          height;
        ctx.globalAlpha = star.alpha;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(star.x * width, y, star.size, star.size);
      }
      ctx.globalAlpha = 1;
    }

    let width = 0;
    let height = 0;
    let px = 0;
    let py = 0;

    // 子彈陣列與設定
    const bullets = [];
    const BULLET_SPEED = 520;      // 子彈速度（像素／秒）
    const SHOT_SPREAD = 0.28;      // 左右子彈的擴散角度（弧度）
    const FIRE_INTERVAL = 220;     // 每 220 毫秒自動發射一次

    // 敵機陣列與設定
    const enemies = [];
    const ENEMY_SIZE = 30;
    const ENEMY_SPEED = 130;           // 敵機基礎速度（像素／秒）
    const ENEMY_SPAWN_INTERVAL = 700;  // 每 700 毫秒生成一架
    const ENEMY_FIRE_INTERVAL = 0.8;   // 每 800 毫秒開火一次
    const ENEMY_BULLET_SPEED = 210;
    const enemyBullets = [];
    const bossLasers = [];

    // 第一隻 Boss
    const BOSS_RADIUS = 30;
    const BOSS_HP = 100;
    const BOSS_FIRE_INTERVAL = 0.15;
    let boss = null;
    let mobKills = 0;
    let stageClear = false;

    // 分數、生命與爆炸效果
    let score = 0;
    let playerHP = 3;
    let bombs = 3;
    let bombTimer = 0;
    let gameOver = false;
    let invincible = 0;
    let godMode = false;
    const BOMB_RADIUS = 260;
    const explosions = [];

    // 關卡與 Stage 2 / Stage 3 狀態
    let stage = 1;
    let currentStage = '1-1';
    let stageClearTimer = 0;
    let stage2State = 'idle';
    let stage2MidBoss = null;
    let stage2MobKills = 0;
    let stage2MobTime = 0;

    let stage3Transition = false;
    let stage3Timer = 0;
    let stage3State = 'idle';
    let stage3MobKills = 0;
    let stage3MobTime = 0;
    let stage3FinalBoss = null;
    let stage3Cleared = false;
    const STAGE3_MOB_INTERVAL = 150;
    const RAINBOW_COLORS = [
      '#ff5b6e', '#ffb347', '#ffe66d', '#5eff8a',
      '#63f5ff', '#6b91ff', '#c46bff', '#ff7bd5'
    ];

    function hexA(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    // 玩家判定點與擦彈
    const PLAYER_HIT_RADIUS = 3;
    const GRAZE_INTERVAL = 0.5;
    const PLAYER_SHAPE = [
      { x: 0, y: -18 },
      { x: 14, y: 16 },
      { x: 0, y: 9 },
      { x: -14, y: 16 }
    ];
    let grazeTimer = GRAZE_INTERVAL;
    let isGrazing = false;

    function draw() {
      // 滾動星空背景
      drawBackground();

      // 敵機
      drawEnemies();

      // Boss
      drawBoss();
      drawStage2MidBoss();
      drawStage3FinalBoss();

      // 紅色子彈
      drawBullets();

      // 敵機藍色子彈
      drawEnemyBullets();

      // Boss 雷射
      drawBossLasers();

      // 白色三角形（玩家飛機）
      ctx.save();
      ctx.translate(px, py);
      if (invincible > 0 && Math.floor(performance.now() / 100) % 2 === 0) {
        ctx.globalAlpha = 0.35;
      }
      ctx.beginPath();
      ctx.moveTo(0, -18);
      ctx.lineTo(14, 16);
      ctx.lineTo(0, 9);
      ctx.lineTo(-14, 16);
      ctx.closePath();
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.restore();

      // 自機正中心的紅色判定點
      ctx.beginPath();
      ctx.arc(px, py, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#ff2448';
      ctx.fill();

      drawBombEffect();

      // 爆炸效果、分數與生命
      drawExplosions();
      drawHUD();
      if (boss || stage2MidBoss || stage3FinalBoss) drawBossHUD();
      drawSpellCardUI();
      if (gameOver) drawGameOver();
      if (stageClear) drawStageClear();
      if (stage3Transition) drawStage3Enter();
      if (stage3Cleared) drawStage3Clear();
    }

    function drawBullets() {
      ctx.fillStyle = '#ff3b3b';
      for (const bullet of bullets) {
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, bullet.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawEnemyBullets() {
      for (const bullet of enemyBullets) {
        if (bullet.laser) {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.strokeStyle = bullet.color || '#fff36b';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(bullet.x - bullet.vx * 0.035, bullet.y - bullet.vy * 0.035);
          ctx.lineTo(bullet.x, bullet.y);
          ctx.stroke();
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(bullet.x, bullet.y, bullet.r * 0.7, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          continue;
        }

        if (bullet.bouncy) {
          ctx.save();
          ctx.translate(bullet.x, bullet.y);
          ctx.rotate((bullet.t || 0) * 5);
          ctx.fillStyle = bullet.color || '#ff7bd5';
          ctx.beginPath();
          for (let k = 0; k < 8; k += 1) {
            const angle = (k / 8) * Math.PI * 2;
            const radius = k % 2 === 0 ? bullet.r * 1.45 : bullet.r * 0.6;
            const x = Math.cos(angle) * radius;
            const y = Math.sin(angle) * radius;
            if (k === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.closePath();
          ctx.fill();
          ctx.restore();
          continue;
        }

        ctx.fillStyle = bullet.color || '#4fc3ff';
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, bullet.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawBossLasers() {
      for (const laser of bossLasers) {
        const endX = laser.x + Math.cos(laser.angle) * laser.length;
        const endY = laser.y + Math.sin(laser.angle) * laser.length;

        ctx.save();
        ctx.strokeStyle = laser.color;
        ctx.lineCap = 'round';

        if (laser.age < laser.warn) {
          ctx.globalAlpha = 0.25 + 0.25 * Math.sin(laser.age * 30);
          ctx.lineWidth = 2;
          ctx.setLineDash([10, 14]);
          ctx.beginPath();
          ctx.moveTo(laser.x, laser.y);
          ctx.lineTo(endX, endY);
          ctx.stroke();
          ctx.setLineDash([]);
        } else {
          const progress = Math.min(
            1,
            (laser.age - laser.warn) / laser.active
          );
          const alpha = Math.sin(Math.PI * progress);

          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = alpha * 0.16;
          ctx.lineWidth = laser.width * 2.5;
          ctx.beginPath();
          ctx.moveTo(laser.x, laser.y);
          ctx.lineTo(endX, endY);
          ctx.stroke();

          ctx.globalAlpha = alpha * 0.9;
          ctx.lineWidth = laser.width;
          ctx.beginPath();
          ctx.moveTo(laser.x, laser.y);
          ctx.lineTo(endX, endY);
          ctx.stroke();

          ctx.globalAlpha = alpha;
          ctx.strokeStyle = '#fff2f4';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(laser.x, laser.y);
          ctx.lineTo(endX, endY);
          ctx.stroke();
        }

        ctx.restore();
      }
    }

    function drawSpellCardUI() {
      const target = stage3FinalBoss || boss;
      if (!target || !target.spellName) return;

      const isFinal = Boolean(stage3FinalBoss);
      const color = isFinal ? '#ffd166' : '#ff4d5e';
      const intro = Math.min(1, target.age * 2.2);
      const x = width - 20 + (1 - intro) * 26;
      const y = 100 + Math.sin(target.age * 3.2) * 2;
      const panelWidth = Math.min(360, width * 0.62);

      ctx.save();
      ctx.globalAlpha = intro;

      ctx.fillStyle = 'rgba(3, 7, 14, 0.6)';
      ctx.fillRect(width - 20 - panelWidth, y - 25, panelWidth, 50);
      ctx.fillStyle = color;
      ctx.fillRect(width - 20 - panelWidth, y - 25, 2, 50);

      ctx.textAlign = 'left';
      ctx.fillStyle = color;
      ctx.font = 'bold 9px monospace';
      ctx.fillText(isFinal ? 'FINAL SPELL CARD' : 'SPELL CARD', width - 20 - panelWidth + 12, y - 8);

      ctx.textAlign = 'right';
      ctx.shadowColor = color;
      ctx.shadowBlur = 12;
      ctx.fillStyle = color;
      ctx.font = `bold ${Math.min(22, width * 0.034)}px "Microsoft JhengHei", sans-serif`;
      ctx.fillText(target.spellName, x, y + 15, panelWidth - 22);
      ctx.restore();
    }

    function shoot() {
      if (
        !width ||
        !height ||
        gameOver ||
        stageClear ||
        stage3Transition ||
        stage3Cleared ||
        stage2State === 'finalPending'
      ) return;

      // 三分叉：左斜、正上、右斜
      [-SHOT_SPREAD, 0, SHOT_SPREAD].forEach((angle) => {
        bullets.push({
          x: px,
          y: py - 24,
          vx: Math.sin(angle) * BULLET_SPEED,
          vy: -Math.cos(angle) * BULLET_SPEED,
          r: 4
        });
      });
    }

    function updateBullets(dt) {
      for (let i = bullets.length - 1; i >= 0; i--) {
        const bullet = bullets[i];
        bullet.x += bullet.vx * dt;
        bullet.y += bullet.vy * dt;

        // 飛出畫面後移除
        if (
          bullet.y < -10 ||
          bullet.x < -10 ||
          bullet.x > width + 10
        ) {
          bullets.splice(i, 1);
        }
      }
    }

    function splitBouncyBullet(bullet) {
      if (bullet.bounceGen >= 1 || enemyBullets.length >= 1400) return;

      for (let i = 0; i < 2; i += 1) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 110 + Math.random() * 230;
        enemyBullets.push({
          x: bullet.x,
          y: bullet.y,
          prevX: bullet.x,
          prevY: bullet.y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          r: Math.max(3, bullet.r * 0.72),
          color: bullet.bounceGen === 0 ? '#c46bff' : '#ff7bd5',
          bouncy: true,
          bounceGen: bullet.bounceGen + 1,
          t: 0
        });
      }
    }

    function updateEnemyBullets(dt) {
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const bullet = enemyBullets[i];
        bullet.prevX = bullet.x;
        bullet.prevY = bullet.y;
        bullet.t = (bullet.t || 0) + dt;
        bullet.x += bullet.vx * dt;
        bullet.y += bullet.vy * dt;

        if (bullet.bouncy) {
          let hitWall = false;

          if (bullet.x < bullet.r) {
            bullet.x = bullet.r;
            bullet.vx = Math.abs(bullet.vx);
            hitWall = true;
          } else if (bullet.x > width - bullet.r) {
            bullet.x = width - bullet.r;
            bullet.vx = -Math.abs(bullet.vx);
            hitWall = true;
          }

          if (bullet.y < bullet.r) {
            bullet.y = bullet.r;
            bullet.vy = Math.abs(bullet.vy);
            hitWall = true;
          } else if (bullet.y > height - bullet.r) {
            bullet.y = height - bullet.r;
            bullet.vy = -Math.abs(bullet.vy);
            hitWall = true;
          }

          if (hitWall) splitBouncyBullet(bullet);

          if (bullet.t > 9) {
            enemyBullets.splice(i, 1);
          }
          continue;
        }

        if (
          bullet.x < -10 ||
          bullet.x > width + 10 ||
          bullet.y < -10 ||
          bullet.y > height + 10
        ) {
          enemyBullets.splice(i, 1);
        }
      }
    }

    function drawEnemies() {
      for (const enemy of enemies) {
        ctx.fillStyle = enemy.color;
        ctx.fillRect(enemy.x, enemy.y, ENEMY_SIZE, ENEMY_SIZE);
      }
    }

    function spawnEnemy() {
      if (!width || !height || gameOver || stageClear) return;
      if (stage === 3) return;

      if (stage === 2) {
        if (stage2State === 'mobs') spawnStage2Mob();
        return;
      }

      if (boss) return;

      enemies.push({
        x: Math.random() * (width - ENEMY_SIZE),
        y: -ENEMY_SIZE,
        targetY: height * (0.1 + Math.random() * 0.3),
        arrived: false,
        driftDir: Math.random() < 0.5 ? -1 : 1,
        driftSpeed: 22 + Math.random() * 33,
        fireTimer: ENEMY_FIRE_INTERVAL,
        speed: ENEMY_SPEED * (0.65 + Math.random() * 0.8),
        color: Math.random() < 0.5 ? '#39ff88' : '#ff4d4d'
      });
    }

    function spawnStage2Mob(isStage3 = false) {
      if (!width || !height || gameOver || stageClear) return;

      const fromLeft = Math.random() < 0.5;
      const startX = fromLeft ? -ENEMY_SIZE : width + ENEMY_SIZE;
      const startY = height * (0.06 + Math.random() * 0.22);
      const targetX = width * (0.15 + Math.random() * 0.7);
      const targetY = height * (0.12 + Math.random() * 0.25);
      const controlX = (startX + targetX) / 2;
      const controlY = Math.max(20, startY - height * (0.08 + Math.random() * 0.12));
      const colorA = Math.random() < 0.5 ? '#ff7bd5' : '#c46bff';
      const colorB = colorA === '#ff7bd5' ? '#c46bff' : '#ff7bd5';

      enemies.push({
        stage2: true,
        stage3: isStage3,
        x: startX,
        y: startY,
        startX,
        startY,
        controlX,
        controlY,
        targetX,
        targetY,
        entryDuration: 1.2 + Math.random() * 0.8,
        arrived: false,
        t: 0,
        seed: Math.random() * Math.PI * 2,
        fireTimer: ENEMY_FIRE_INTERVAL,
        bulletColor: colorA,
        altColor: colorB,
        color: colorA,
        dead: false
      });
    }

    function spawnStage3Mob() {
      if (
        stage !== 3 ||
        stage3State !== 'mobs' ||
        gameOver ||
        stageClear ||
        stage3Transition
      ) return;
      spawnStage2Mob(true);
    }

    function updateStage2Mob(enemy, dt) {
      if (!enemy.arrived) {
        const progress = Math.min(1, enemy.t / enemy.entryDuration);
        const inv = 1 - progress;

        // 二次貝茲曲線：從左右兩側弧形切入
        enemy.x =
          inv * inv * enemy.startX +
          2 * inv * progress * enemy.controlX +
          progress * progress * enemy.targetX;
        enemy.y =
          inv * inv * enemy.startY +
          2 * inv * progress * enemy.controlY +
          progress * progress * enemy.targetY;

        if (progress >= 1) enemy.arrived = true;
        return;
      }

      enemy.x = enemy.targetX + Math.sin(enemy.t * 1.4 + enemy.seed) * 38;
      enemy.y = enemy.targetY + Math.sin(enemy.t * 1.1 + enemy.seed) * 8;

      enemy.fireTimer -= dt;
      if (enemy.fireTimer <= 0) {
        enemy.fireTimer = ENEMY_FIRE_INTERVAL;
        const sx = enemy.x + ENEMY_SIZE / 2;
        const sy = enemy.y + ENEMY_SIZE / 2;
        const baseAngle = Math.atan2(py - sy, px - sx);

        for (let k = -1; k <= 1; k += 1) {
          const angle = baseAngle + k * 0.14;
          enemyBullets.push({
            x: sx,
            y: sy,
            vx: Math.cos(angle) * 205,
            vy: Math.sin(angle) * 205,
            r: 5,
            color: k === 0 ? enemy.bulletColor : enemy.altColor
          });
        }
      }
    }

    function updateEnemies(dt) {
      for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];
        enemy.t = (enemy.t || 0) + dt;

        if (enemy.stage2) {
          updateStage2Mob(enemy, dt);
          continue;
        }

        // 下降到畫面上半部後停住
        if (!enemy.arrived) {
          enemy.y += enemy.speed * dt;
          if (enemy.y >= enemy.targetY) {
            enemy.y = enemy.targetY;
            enemy.arrived = true;
          }
          continue;
        }

        // 在上半部左右緩慢飄移
        enemy.x += enemy.driftDir * enemy.driftSpeed * dt;
        if (enemy.x <= 0) {
          enemy.x = 0;
          enemy.driftDir = 1;
        } else if (enemy.x >= width - ENEMY_SIZE) {
          enemy.x = width - ENEMY_SIZE;
          enemy.driftDir = -1;
        }

        // 每 800 毫秒朝玩家發射藍色子彈
        enemy.fireTimer -= dt;
        if (enemy.fireTimer <= 0) {
          enemy.fireTimer = ENEMY_FIRE_INTERVAL;
          const sx = enemy.x + ENEMY_SIZE / 2;
          const sy = enemy.y + ENEMY_SIZE / 2;
          const angle = Math.atan2(py - sy, px - sx);

          enemyBullets.push({
            x: sx,
            y: sy,
            vx: Math.cos(angle) * ENEMY_BULLET_SPEED,
            vy: Math.sin(angle) * ENEMY_BULLET_SPEED,
            r: 5
          });
        }
      }
    }

    function startBoss() {
      if (boss || stageClear) return;

      enemies.length = 0;
      enemyBullets.length = 0;

      boss = {
        x: width / 2,
        y: -60,
        targetY: Math.max(110, height * 0.18),
        r: BOSS_RADIUS,
        hp: BOSS_HP,
        maxHp: BOSS_HP,
        age: 0,
        angle: 0,
        stage: 1,
        spellName: '神罰「雙重逆襲」',
        laserTimer: 1.5,
        fireTimer: BOSS_FIRE_INTERVAL,
        entering: true,
        defeated: false,
        deathTimer: 0,
        flash: 0
      };
      bossLasers.length = 0;
    }

    function updateBoss(dt) {
      if (!boss) return;

      boss.age += dt;
      boss.flash = Math.max(0, boss.flash - dt * 6);

      if (boss.defeated) {
        boss.deathTimer += dt;
        if (Math.random() < dt * 22) {
          addExplosion(
            boss.x + (Math.random() - 0.5) * 80,
            boss.y + (Math.random() - 0.5) * 80,
            '#ffd166'
          );
        }
        if (boss.deathTimer >= 1.2) {
          boss = null;
          if (stage === 2) {
            healPlayer();
            stage2State = 'stage3Transition';
            stage3Transition = true;
            stage3Timer = 3.2;
            enemyBullets.length = 0;
          } else {
            healPlayer();
            stageClear = true;
            stageClearTimer = 3.2;
          }
        }
        return;
      }

      if (boss.entering) {
        boss.y += 160 * dt;
        if (boss.y >= boss.targetY) {
          boss.y = boss.targetY;
          boss.entering = false;
        }
        return;
      }

      boss.y = boss.targetY + Math.sin(boss.age * 1.8) * 5;
      boss.fireTimer -= dt;

      // 每 150 毫秒發射一輪旋轉 Ring Shot
      while (boss.fireTimer <= 0) {
        boss.fireTimer += BOSS_FIRE_INTERVAL;
        boss.angle += 0.22;

        for (let i = 0; i < 8; i += 1) {
          const angle = boss.angle + (i / 8) * Math.PI * 2;
          const speed = 155 + (i % 2) * 45;
          enemyBullets.push({
            x: boss.x,
            y: boss.y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            r: 5
          });
        }
      }

      if (boss.stage === 1) {
        // 神罰「雙重逆襲」：每 1.5 秒兩道交叉雷射
        boss.laserTimer -= dt;
        if (boss.laserTimer <= 0) {
          boss.laserTimer += 1.5;
          spawnBossLaserPair(boss);
        }
      } else if (boss.stage === 2) {
        // 禁忌「瘋狂反彈」：高速反彈刺蝟彈
        boss.bounceTimer -= dt;
        if (boss.bounceTimer <= 0) {
          boss.bounceTimer += 0.8;
          boss.angle += 0.13;

          for (let i = 0; i < 6; i += 1) {
            const angle = boss.angle + (i / 6) * Math.PI * 2;
            enemyBullets.push({
              x: boss.x,
              y: boss.y,
              prevX: boss.x,
              prevY: boss.y,
              vx: Math.cos(angle) * 200,
              vy: Math.sin(angle) * 200,
              r: 6,
              color: '#ff5bd1',
              bouncy: true,
              bounceGen: 0,
              t: 0
            });
          }
        }
      }
    }

    function checkBossCollision() {
      if (!boss || boss.entering || boss.defeated || gameOver) return;

      for (let i = bullets.length - 1; i >= 0; i -= 1) {
        const bullet = bullets[i];
        const dx = bullet.x - boss.x;
        const dy = bullet.y - boss.y;

        if (dx * dx + dy * dy <= Math.pow(boss.r + bullet.r, 2)) {
          boss.hp -= 1;
          boss.flash = 0.3;
          bullets.splice(i, 1);

          if (boss.hp <= 0) {
            boss.hp = 0;
            defeatBoss();
            break;
          }
        }
      }
    }

    function spawnBossLaserPair(source) {
      const startY = source.y + 12;
      const bottomY = height + 50;
      const leftX = source.x - 70;
      const rightX = source.x + 70;
      const leftTargetX = width / 2 + 45;
      const rightTargetX = width / 2 - 45;

      const makeLaser = (x, targetX) => {
        const angle = Math.atan2(bottomY - startY, targetX - x);
        return {
          x,
          y: startY,
          angle,
          length: Math.hypot(targetX - x, bottomY - startY),
          age: 0,
          warn: 0.55,
          active: 0.48,
          width: 10,
          color: '#ff334d'
        };
      };

      bossLasers.push(makeLaser(leftX, leftTargetX));
      bossLasers.push(makeLaser(rightX, rightTargetX));
    }

    function updateBossLasers(dt) {
      for (let i = bossLasers.length - 1; i >= 0; i -= 1) {
        bossLasers[i].age += dt;
        if (bossLasers[i].age >= bossLasers[i].warn + bossLasers[i].active) {
          bossLasers.splice(i, 1);
        }
      }
    }

    function checkBossLaserCollision() {
      if (gameOver || invincible > 0) return;

      for (const laser of bossLasers) {
        if (laser.age < laser.warn) continue;
        if (laser.age > laser.warn + laser.active) continue;

        const endX = laser.x + Math.cos(laser.angle) * laser.length;
        const endY = laser.y + Math.sin(laser.angle) * laser.length;
        const hitRadius = laser.width / 2 + PLAYER_HIT_RADIUS;

        if (
          distanceToSegmentSq(px, py, laser.x, laser.y, endX, endY) <=
          hitRadius * hitRadius
        ) {
          loseLife(true);
          break;
        }
      }
    }

    function defeatBoss() {
      if (!boss || boss.defeated) return;

      boss.defeated = true;
      boss.deathTimer = 0;
      boss.fireTimer = Infinity;
      enemyBullets.length = 0;
      bossLasers.length = 0;
      score += 5000;

      for (let i = 0; i < 10; i += 1) {
        addExplosion(
          boss.x + (Math.random() - 0.5) * 70,
          boss.y + (Math.random() - 0.5) * 70,
          '#ffd166'
        );
      }
    }

    function checkBossTrigger() {
      if (stage !== 1 || boss || stageClear || gameOver) return;
      if (mobKills >= 20 || score >= 20000) startBoss();
    }

    function startStage2() {
      stage = 2;
      currentStage = '2-1';
      playerHP = 3;
      bombs = 3;
      stageClear = false;
      stageClearTimer = 0;
      stage2State = 'mobs';
      stage2MidBoss = null;
      stage2MobKills = 0;
      stage2MobTime = 0;
      mobKills = 0;

      boss = null;
      enemies.length = 0;
      enemyBullets.length = 0;
      bossLasers.length = 0;
      invincible = Math.max(invincible, 1.2);
      setMusicTrack(2);
    }

    function spawnStage2MidBoss() {
      if (stage !== 2 || stage2MidBoss || stage2State !== 'mobs') return;

      stage2State = 'midboss';
      currentStage = '2-2';
      stage2MobTime = 0;
      enemies.length = 0;
      enemyBullets.length = 0;

      stage2MidBoss = {
        x: width / 2,
        y: -55,
        targetY: Math.max(110, height * 0.2),
        r: 25,
        hp: 60,
        maxHp: 60,
        age: 0,
        entering: true,
        fireTimer: 1,
        defeated: false,
        deathTimer: 0,
        flash: 0
      };
    }

    function updateStage2MidBoss(dt) {
      const midBoss = stage2MidBoss;
      if (!midBoss) return;

      midBoss.age += dt;
      midBoss.flash = Math.max(0, midBoss.flash - dt * 6);

      if (midBoss.defeated) {
        midBoss.deathTimer += dt;
        if (Math.random() < dt * 20) {
          addExplosion(
            midBoss.x + (Math.random() - 0.5) * 60,
            midBoss.y + (Math.random() - 0.5) * 60,
            '#ff7bd5'
          );
        }
        if (midBoss.deathTimer >= 1.2) {
          stage2MidBoss = null;
          enemyBullets.length = 0;
          spawnStage2FinalBoss();
        }
        return;
      }

      if (midBoss.entering) {
        midBoss.y += 150 * dt;
        if (midBoss.y >= midBoss.targetY) {
          midBoss.y = midBoss.targetY;
          midBoss.entering = false;
        }
        return;
      }

      midBoss.x = width / 2 + Math.sin(midBoss.age * 0.75) * 130;
      midBoss.y = midBoss.targetY + Math.sin(midBoss.age * 1.3) * 8;

      // 每 1 秒朝玩家當前位置發射 5-Way Aiming Shot
      midBoss.fireTimer -= dt;
      if (midBoss.fireTimer <= 0) {
        midBoss.fireTimer += 1;
        const baseAngle = Math.atan2(py - midBoss.y, px - midBoss.x);

        for (let i = -2; i <= 2; i += 1) {
          const angle = baseAngle + i * 0.13;
          enemyBullets.push({
            x: midBoss.x,
            y: midBoss.y,
            vx: Math.cos(angle) * 215,
            vy: Math.sin(angle) * 215,
            r: 5,
            color: i % 2 === 0 ? '#ff7bd5' : '#c46bff'
          });
        }
      }
    }

    function spawnStage2FinalBoss() {
      stage2State = 'finalBoss';
      currentStage = '2-3';
      boss = {
        x: width / 2,
        y: -75,
        targetY: Math.max(120, height * 0.18),
        r: 34,
        hp: 120,
        maxHp: 120,
        age: 0,
        angle: 0,
        stage: 2,
        spellName: '禁忌「瘋狂反彈」',
        bounceTimer: 0.8,
        fireTimer: BOSS_FIRE_INTERVAL,
        entering: true,
        defeated: false,
        deathTimer: 0,
        flash: 0
      };
      bossLasers.length = 0;
    }

    function checkStage2MidBossCollision() {
      if (!stage2MidBoss || stage2MidBoss.entering || stage2MidBoss.defeated) return;

      for (let i = bullets.length - 1; i >= 0; i -= 1) {
        const bullet = bullets[i];
        const dx = bullet.x - stage2MidBoss.x;
        const dy = bullet.y - stage2MidBoss.y;

        if (
          dx * dx + dy * dy <=
          Math.pow(stage2MidBoss.r + bullet.r, 2)
        ) {
          stage2MidBoss.hp -= 1;
          stage2MidBoss.flash = 0.3;
          bullets.splice(i, 1);

          if (stage2MidBoss.hp <= 0) {
            stage2MidBoss.hp = 0;
            defeatStage2MidBoss();
            break;
          }
        }
      }
    }

    function defeatStage2MidBoss() {
      if (!stage2MidBoss || stage2MidBoss.defeated) return;

      stage2MidBoss.defeated = true;
      stage2MidBoss.deathTimer = 0;
      stage2MidBoss.fireTimer = Infinity;
      enemyBullets.length = 0;
      score += 10000;

      for (let i = 0; i < 8; i += 1) {
        addExplosion(
          stage2MidBoss.x + (Math.random() - 0.5) * 55,
          stage2MidBoss.y + (Math.random() - 0.5) * 55,
          '#ff7bd5'
        );
      }
    }

    function updateStage2Flow(dt) {
      if (stage !== 2 || gameOver || stageClear) return;
      if (stage2State !== 'mobs') return;

      stage2MobTime += dt;
      if (stage2MobKills >= 12 || stage2MobTime >= 22) {
        spawnStage2MidBoss();
      }
    }

    function startStage3() {
      stage = 3;
      currentStage = '3-1';
      playerHP = 3;
      bombs = 3;
      stage3Transition = false;
      stage3Timer = 0;
      stage3State = 'mobs';
      stage3MobKills = 0;
      stage3MobTime = 0;
      stage3FinalBoss = null;
      stage3Cleared = false;

      boss = null;
      stage2MidBoss = null;
      enemies.length = 0;
      enemyBullets.length = 0;
      bossLasers.length = 0;
      invincible = Math.max(invincible, 1.5);
    }

    function updateStage3Flow(dt) {
      if (
        stage !== 3 ||
        gameOver ||
        stage3Transition ||
        stage3Cleared ||
        stage3State !== 'mobs'
      ) return;

      stage3MobTime += dt;
      if (stage3MobTime >= 14 || stage3MobKills >= 24) {
        spawnStage3FinalBoss();
      }
    }

    function spawnStage3FinalBoss() {
      if (stage !== 3 || stage3State !== 'mobs') return;

      stage3State = 'boss';
      currentStage = '3-3';
      enemies.length = 0;
      enemyBullets.length = 0;

      stage3FinalBoss = {
        x: width / 2,
        y: -90,
        targetY: Math.max(120, height * 0.16),
        r: 36,
        hp: 240,
        maxHp: 240,
        age: 0,
        entering: true,
        phase: 1,
        spellName: '魂符「終焉兒歌·靈魂之雨」',
        fireTimer: 0.05,
        spiralCW: 0,
        spiralCCW: 0,
        rainTimer: 0.06,
        laserTimer: 1,
        orbTimer: 0.1,
        snipeTimer: 1,
        bounceTimer: 1.2,
        snipePause: 0,
        orbs: [0, 1, 2, 3].map((index) => ({
          angle: (index / 4) * Math.PI * 2,
          speed: 0.72 + index * 0.16
        })),
        defeated: false,
        deathTimer: 0,
        flash: 0
      };
      bossLasers.length = 0;
    }

    function updateStage3FinalBoss(dt) {
      const bossUnit = stage3FinalBoss;
      if (!bossUnit) return;

      bossUnit.age += dt;
      bossUnit.flash = Math.max(0, bossUnit.flash - dt * 6);

      if (bossUnit.defeated) {
        bossUnit.deathTimer += dt;
        if (Math.random() < dt * 24) {
          addExplosion(
            bossUnit.x + (Math.random() - 0.5) * 90,
            bossUnit.y + (Math.random() - 0.5) * 90,
            Math.random() < 0.5 ? '#fff36b' : '#5eff8a'
          );
        }
        if (bossUnit.deathTimer >= 1.8) {
          stage3FinalBoss = null;
          stage3State = 'cleared';
          stage3Cleared = true;
          enemyBullets.length = 0;
        }
        return;
      }

      if (bossUnit.entering) {
        bossUnit.y += 130 * dt;
        if (bossUnit.y >= bossUnit.targetY) {
          bossUnit.y = bossUnit.targetY;
          bossUnit.entering = false;
        }
        return;
      }

      if (bossUnit.snipePause > 0) {
        bossUnit.snipePause -= dt;
      } else {
        bossUnit.x = width / 2 + Math.sin(bossUnit.age * 0.6) * 100;
      }
      bossUnit.y = bossUnit.targetY + Math.sin(bossUnit.age * 1.2) * 6;

      // 四顆環繞陰陽玉：七彩、速度差極大的隨機彈
      bossUnit.orbs.forEach((orb) => {
        orb.angle += dt * orb.speed;
      });

      bossUnit.orbTimer -= dt;
      while (bossUnit.orbTimer <= 0) {
        bossUnit.orbTimer += 0.24;

        bossUnit.orbs.forEach((orb, index) => {
          const ox = bossUnit.x + Math.cos(orb.angle) * 92;
          const oy = bossUnit.y + Math.sin(orb.angle) * 58;
          const angle = Math.random() * Math.PI * 2;
          const speed = 55 + Math.random() * 340;

          enemyBullets.push({
            x: ox,
            y: oy,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            r: 4.2,
            color: RAINBOW_COLORS[(index + Math.floor(Math.random() * 8)) % 8]
          });
        });
      }

      // 本體反彈刺蝟彈
      bossUnit.bounceTimer -= dt;
      if (bossUnit.bounceTimer <= 0) {
        bossUnit.bounceTimer += 2.2;

        for (let i = 0; i < 4; i += 1) {
          const angle = (i / 4) * Math.PI * 2 + bossUnit.age;
          enemyBullets.push({
            x: bossUnit.x,
            y: bossUnit.y,
            prevX: bossUnit.x,
            prevY: bossUnit.y,
            vx: Math.cos(angle) * 190,
            vy: Math.sin(angle) * 190,
            r: 5.5,
            color: '#ff7bd5',
            bouncy: true,
            bounceGen: 0,
            t: 0
          });
        }
      }

      // 急停追蹤狙
      bossUnit.snipeTimer -= dt;
      if (bossUnit.snipeTimer <= 0) {
        bossUnit.snipeTimer += 1.8;
        bossUnit.snipePause = 0.22;
        const angle = Math.atan2(py - bossUnit.y, px - bossUnit.x);

        enemyBullets.push({
          x: bossUnit.x,
          y: bossUnit.y,
          prevX: bossUnit.x,
          prevY: bossUnit.y,
          vx: Math.cos(angle) * 520,
          vy: Math.sin(angle) * 520,
          r: 6,
          color: '#ffffff'
        });
      }

      if (bossUnit.phase === 1) {
        // 第一階段：順時針＋逆時針雙螺旋，每 50ms 一輪
        bossUnit.fireTimer -= dt;
        while (bossUnit.fireTimer <= 0) {
          bossUnit.fireTimer += 0.095;
          bossUnit.spiralCW += 0.16;
          bossUnit.spiralCCW -= 0.2;

          for (let arm = 0; arm < 2; arm += 1) {
            const cwAngle = bossUnit.spiralCW + arm * Math.PI;
            const ccwAngle = bossUnit.spiralCCW + arm * Math.PI;

            enemyBullets.push({
              x: bossUnit.x,
              y: bossUnit.y,
              vx: Math.cos(cwAngle) * 150,
              vy: Math.sin(cwAngle) * 150,
              r: 4.5,
              color: '#5eff8a'
            });
            enemyBullets.push({
              x: bossUnit.x,
              y: bossUnit.y,
              vx: Math.cos(ccwAngle) * 180,
              vy: Math.sin(ccwAngle) * 180,
              r: 4.5,
              color: '#b6ff5e'
            });
          }
        }
      } else {
        // 第二階段：黃色不規則落雨
        bossUnit.rainTimer -= dt;
        while (bossUnit.rainTimer <= 0) {
          bossUnit.rainTimer += 0.115;
          enemyBullets.push({
            x: Math.random() * width,
            y: -10,
            vx: (Math.random() - 0.5) * 70,
            vy: 190 + Math.random() * 140,
            r: 4.5,
            color: '#ffe66d'
          });
        }

        // 每 1 秒三條高速雷射直線彈
        bossUnit.laserTimer -= dt;
        if (bossUnit.laserTimer <= 0) {
          bossUnit.laserTimer += 1.5;
          const baseAngle = Math.atan2(py - bossUnit.y, px - bossUnit.x);

          for (let i = -1; i <= 1; i += 1) {
            const angle = baseAngle + i * 0.11;
            enemyBullets.push({
              x: bossUnit.x,
              y: bossUnit.y,
              prevX: bossUnit.x,
              prevY: bossUnit.y,
              vx: Math.cos(angle) * 1000,
              vy: Math.sin(angle) * 1000,
              r: 5,
              color: '#fff36b',
              laser: true
            });
          }
        }
      }
    }

    function damageStage3FinalBoss(amount) {
      if (
        !stage3FinalBoss ||
        stage3FinalBoss.entering ||
        stage3FinalBoss.defeated
      ) return;

      stage3FinalBoss.hp -= amount;
      stage3FinalBoss.flash = Math.max(stage3FinalBoss.flash, 0.35);

      if (stage3FinalBoss.hp <= 0) {
        stage3FinalBoss.hp = 0;
        stage3FinalBoss.defeated = true;
        stage3FinalBoss.deathTimer = 0;
        enemyBullets.length = 0;
        healPlayer();
        score += 50000;

        for (let k = 0; k < 12; k += 1) {
          addExplosion(
            stage3FinalBoss.x + (Math.random() - 0.5) * 90,
            stage3FinalBoss.y + (Math.random() - 0.5) * 90,
            Math.random() < 0.5 ? '#fff36b' : '#5eff8a'
          );
        }
        return;
      }

      if (
        stage3FinalBoss.phase === 1 &&
        stage3FinalBoss.hp <= stage3FinalBoss.maxHp / 2
      ) {
        stage3FinalBoss.phase = 2;
        stage3FinalBoss.rainTimer = 0;
        stage3FinalBoss.laserTimer = 0.4;
        enemyBullets.length = 0;
        addExplosion(stage3FinalBoss.x, stage3FinalBoss.y, '#fff36b');
      }
    }

    function checkStage3FinalBossCollision() {
      if (
        !stage3FinalBoss ||
        stage3FinalBoss.entering ||
        stage3FinalBoss.defeated
      ) return;

      for (let i = bullets.length - 1; i >= 0; i -= 1) {
        const bullet = bullets[i];
        const dx = bullet.x - stage3FinalBoss.x;
        const dy = bullet.y - stage3FinalBoss.y;

        if (
          dx * dx + dy * dy <=
          Math.pow(stage3FinalBoss.r + bullet.r, 2)
        ) {
          bullets.splice(i, 1);
          damageStage3FinalBoss(1);
          if (stage3FinalBoss.defeated) break;
        }
      }
    }

    function checkCollisions() {
      if (gameOver) return;

      for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];

        for (let j = bullets.length - 1; j >= 0; j--) {
          const bullet = bullets[j];
          const closestX = Math.max(enemy.x, Math.min(bullet.x, enemy.x + ENEMY_SIZE));
          const closestY = Math.max(enemy.y, Math.min(bullet.y, enemy.y + ENEMY_SIZE));
          const dx = bullet.x - closestX;
          const dy = bullet.y - closestY;

          if (dx * dx + dy * dy <= bullet.r * bullet.r) {
            score += 1000;
            mobKills += 1;
            if (enemy.stage2) stage2MobKills += 1;

            // Stage 3 遺言彈：8 向高速紅色交叉彈
            if (enemy.stage3) {
              stage3MobKills += 1;
              const cx = enemy.x + ENEMY_SIZE / 2;
              const cy = enemy.y + ENEMY_SIZE / 2;

              for (let k = 0; k < 8; k += 1) {
                const angle = (k / 8) * Math.PI * 2;
                enemyBullets.push({
                  x: cx,
                  y: cy,
                  vx: Math.cos(angle) * 340,
                  vy: Math.sin(angle) * 340,
                  r: 5,
                  color: '#ff334d'
                });
              }
            }

            addExplosion(
              enemy.x + ENEMY_SIZE / 2,
              enemy.y + ENEMY_SIZE / 2
            );
            enemies.splice(i, 1);
            bullets.splice(j, 1);
            break;
          }
        }
      }
    }

    function pointInPolygon(x, y, polygon) {
      let inside = false;
      for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        const xi = polygon[i].x;
        const yi = polygon[i].y;
        const xj = polygon[j].x;
        const yj = polygon[j].y;
        const intersect =
          yi > y !== yj > y &&
          x < ((xj - xi) * (y - yi)) / (yj - yi) + xi;
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function distanceToSegmentSq(x, y, x1, y1, x2, y2) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const lengthSq = dx * dx + dy * dy;
      const t = lengthSq
        ? Math.max(0, Math.min(1, ((x - x1) * dx + (y - y1) * dy) / lengthSq))
        : 0;
      const cx = x1 + t * dx;
      const cy = y1 + t * dy;
      return (x - cx) ** 2 + (y - cy) ** 2;
    }

    function circleHitsPolygon(cx, cy, radius, polygon) {
      if (pointInPolygon(cx, cy, polygon)) return true;
      for (let i = 0; i < polygon.length; i++) {
        const a = polygon[i];
        const b = polygon[(i + 1) % polygon.length];
        if (distanceToSegmentSq(cx, cy, a.x, a.y, b.x, b.y) <= radius * radius) {
          return true;
        }
      }
      return false;
    }

    function segmentsIntersect(ax, ay, bx, by, cx, cy, dx, dy) {
      const r1 = (bx - ax) * (cy - ay) - (by - ay) * (cx - ax);
      const r2 = (bx - ax) * (dy - ay) - (by - ay) * (dx - ax);
      const r3 = (dx - cx) * (ay - cy) - (dy - cy) * (ax - cx);
      const r4 = (dx - cx) * (by - cy) - (dy - cy) * (bx - cx);
      return (
        ((r1 > 0 && r2 < 0) || (r1 < 0 && r2 > 0)) &&
        ((r3 > 0 && r4 < 0) || (r3 < 0 && r4 > 0))
      );
    }

    function rectHitsPolygon(rx, ry, rw, rh, polygon) {
      const corners = [
        [rx, ry],
        [rx + rw, ry],
        [rx + rw, ry + rh],
        [rx, ry + rh]
      ];
      for (const [x, y] of corners) {
        if (pointInPolygon(x, y, polygon)) return true;
      }
      for (const point of polygon) {
        if (
          point.x >= rx &&
          point.x <= rx + rw &&
          point.y >= ry &&
          point.y <= ry + rh
        ) {
          return true;
        }
      }
      for (let i = 0; i < polygon.length; i++) {
        const a = polygon[i];
        const b = polygon[(i + 1) % polygon.length];
        for (let j = 0; j < 4; j++) {
          const c = corners[j];
          const d = corners[(j + 1) % 4];
          if (segmentsIntersect(a.x, a.y, b.x, b.y, c[0], c[1], d[0], d[1])) {
            return true;
          }
        }
      }
      return false;
    }

    function checkPlayerCollision() {
      if (gameOver || invincible > 0) return;

      for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];
        const closestX = Math.max(enemy.x, Math.min(px, enemy.x + ENEMY_SIZE));
        const closestY = Math.max(enemy.y, Math.min(py, enemy.y + ENEMY_SIZE));
        const dx = px - closestX;
        const dy = py - closestY;

        // 只有紅色判定點被撞到才算受擊
        if (dx * dx + dy * dy <= PLAYER_HIT_RADIUS * PLAYER_HIT_RADIUS) {
          addExplosion(
            enemy.x + ENEMY_SIZE / 2,
            enemy.y + ENEMY_SIZE / 2,
            '#ff8a5b'
          );
          enemies.splice(i, 1);
          loseLife(true);
          break;
        }

        // 擦到白色三角形邊緣
        if (
          rectHitsPolygon(
            enemy.x - px,
            enemy.y - py,
            ENEMY_SIZE,
            ENEMY_SIZE,
            PLAYER_SHAPE
          )
        ) {
          isGrazing = true;
        }
      }
    }

    function checkEnemyBulletCollision() {
      if (gameOver || invincible > 0) return;

      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const bullet = enemyBullets[i];
        const dx = bullet.x - px;
        const dy = bullet.y - py;
        const hitRadius = bullet.r + PLAYER_HIT_RADIUS;
        const hit = bullet.laser
          ? distanceToSegmentSq(
              px,
              py,
              bullet.prevX !== undefined ? bullet.prevX : bullet.x,
              bullet.prevY !== undefined ? bullet.prevY : bullet.y,
              bullet.x,
              bullet.y
            ) <= hitRadius * hitRadius
          : dx * dx + dy * dy <= hitRadius * hitRadius;

        // 只有撞到紅色判定點才算受擊
        if (hit) {
          enemyBullets.splice(i, 1);
          loseLife(true);
          break;
        }

        // 擦到白色三角形邊緣
        if (
          circleHitsPolygon(
            bullet.x - px,
            bullet.y - py,
            bullet.r,
            PLAYER_SHAPE
          )
        ) {
          isGrazing = true;
        }
      }
    }

    function updateGraze(dt) {
      if (gameOver || invincible > 0) {
        isGrazing = false;
        grazeTimer = GRAZE_INTERVAL;
        return;
      }

      if (!isGrazing) {
        grazeTimer = GRAZE_INTERVAL;
        return;
      }

      grazeTimer -= dt;
      if (grazeTimer <= 0) {
        score += 100;
        grazeTimer += GRAZE_INTERVAL;
      }
    }

    function loseLife(byCollision) {
      if (gameOver || godMode) return;
      if (byCollision && invincible > 0) return;

      playerHP -= 1;
      invincible = 1.0;
      addExplosion(px, py, '#ff4d4d');

      if (playerHP <= 0) {
        playerHP = 0;
        gameOver = true;
      }
    }

    function healPlayer() {
      playerHP = Math.min(playerHP + 1, 3);
    }

    function useBomb() {
      if (
        bombs <= 0 ||
        gameOver ||
        stageClear ||
        stage3Transition ||
        stage3Cleared
      ) return;

      bombs -= 1;
      bombTimer = 5;
      invincible = Math.max(invincible, 5);

      // 清除玩家附近彈幕
      for (let i = enemyBullets.length - 1; i >= 0; i -= 1) {
        const bullet = enemyBullets[i];
        const dx = bullet.x - px;
        const dy = bullet.y - py;

        if (dx * dx + dy * dy <= BOMB_RADIUS * BOMB_RADIUS) {
          enemyBullets.splice(i, 1);
        }
      }

      // 對目前 Boss 造成 10 點傷害
      if (boss && !boss.entering && !boss.defeated) {
        boss.hp -= 10;
        boss.flash = 0.6;
        if (boss.hp <= 0) {
          boss.hp = 0;
          defeatBoss();
        }
      }

      if (stage2MidBoss && !stage2MidBoss.entering && !stage2MidBoss.defeated) {
        stage2MidBoss.hp -= 10;
        stage2MidBoss.flash = 0.6;
        if (stage2MidBoss.hp <= 0) {
          stage2MidBoss.hp = 0;
          defeatStage2MidBoss();
        }
      }

      if (stage3FinalBoss) {
        damageStage3FinalBoss(10);
      }

      for (let i = 0; i < 10; i += 1) {
        const angle = (i / 10) * Math.PI * 2;
        addExplosion(
          px + Math.cos(angle) * 72,
          py + Math.sin(angle) * 72,
          '#ffe66d'
        );
      }
    }

    function updateBombEffect(dt) {
      if (bombTimer <= 0) return;

      bombTimer = Math.max(0, bombTimer - dt);

      // 5 秒內持續清除玩家附近彈幕
      for (let i = enemyBullets.length - 1; i >= 0; i -= 1) {
        const bullet = enemyBullets[i];
        const dx = bullet.x - px;
        const dy = bullet.y - py;

        if (dx * dx + dy * dy <= BOMB_RADIUS * BOMB_RADIUS) {
          enemyBullets.splice(i, 1);
        }
      }
    }

    function addExplosion(x, y, color = '#ffd166') {
      explosions.push({
        x,
        y,
        life: 0.35,
        maxLife: 0.35,
        color
      });
    }

    function updateExplosions(dt) {
      for (let i = explosions.length - 1; i >= 0; i--) {
        explosions[i].life -= dt;
        if (explosions[i].life <= 0) {
          explosions.splice(i, 1);
        }
      }
    }

    function drawExplosions() {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';

      for (const explosion of explosions) {
        const ratio = explosion.life / explosion.maxLife;
        const progress = 1 - ratio;
        const size = ENEMY_SIZE * (0.6 + progress * 1.8);

        ctx.globalAlpha = ratio;
        ctx.strokeStyle = explosion.color;
        ctx.lineWidth = 2;
        ctx.strokeRect(
          explosion.x - size / 2,
          explosion.y - size / 2,
          size,
          size
        );

        if (progress < 0.45) {
          ctx.fillStyle = 'rgba(255, 255, 220, 0.9)';
          ctx.fillRect(
            explosion.x - ENEMY_SIZE / 2,
            explosion.y - ENEMY_SIZE / 2,
            ENEMY_SIZE,
            ENEMY_SIZE
          );
        }
      }

      ctx.restore();
    }

    function drawBoss() {
      if (!boss) return;

      ctx.save();
      ctx.translate(boss.x, boss.y);
      ctx.globalAlpha = boss.defeated
        ? Math.max(0, 1 - boss.deathTimer / 1.2) *
          (0.55 + Math.sin(boss.deathTimer * 28) * 0.45)
        : 1;

      // 金色光暈與旋轉外環
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const glow = ctx.createRadialGradient(0, 0, 4, 0, 0, 82);
      glow.addColorStop(0, 'rgba(255, 220, 120, 0.5)');
      glow.addColorStop(0.5, 'rgba(255, 180, 60, 0.12)');
      glow.addColorStop(1, 'rgba(255, 180, 60, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, 82, 0, Math.PI * 2);
      ctx.fill();

      ctx.rotate(boss.age * 1.2);
      ctx.strokeStyle = 'rgba(255, 226, 146, 0.85)';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.arc(0, 0, 43, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();

      // 60x60 金色球體
      const body = ctx.createRadialGradient(-10, -12, 3, 0, 0, 30);
      body.addColorStop(0, '#fffbe3');
      body.addColorStop(0.28, '#ffe37a');
      body.addColorStop(0.68, '#dca42c');
      body.addColorStop(1, '#5c3307');
      ctx.fillStyle = body;
      ctx.strokeStyle = '#ffe9a8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, 30, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#2a1609';
      ctx.strokeStyle = 'rgba(255, 220, 120, 0.8)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(0, 0, 17, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // 旋轉星形核心
      ctx.save();
      ctx.rotate(-boss.age * 2.1);
      ctx.fillStyle = '#fff4b8';
      ctx.beginPath();
      for (let i = 0; i < 8; i += 1) {
        const angle = (i / 8) * Math.PI * 2;
        const radius = i % 2 === 0 ? 13 : 5;
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // 環繞光點
      ctx.fillStyle = 'rgba(255, 238, 169, 0.9)';
      for (let i = 0; i < 4; i += 1) {
        const angle = boss.age * 1.7 + (i / 4) * Math.PI * 2;
        ctx.beginPath();
        ctx.arc(Math.cos(angle) * 38, Math.sin(angle) * 38, 2.2, 0, Math.PI * 2);
        ctx.fill();
      }

      if (boss.flash > 0) {
        ctx.globalAlpha *= boss.flash;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(0, 0, 30, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function drawStage2MidBoss() {
      if (!stage2MidBoss) return;

      const midBoss = stage2MidBoss;
      ctx.save();
      ctx.translate(midBoss.x, midBoss.y);
      ctx.globalAlpha = midBoss.defeated
        ? Math.max(0, 1 - midBoss.deathTimer / 1.2)
        : 1;

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const glow = ctx.createRadialGradient(0, 0, 3, 0, 0, 66);
      glow.addColorStop(0, 'rgba(255, 123, 213, 0.5)');
      glow.addColorStop(0.55, 'rgba(196, 107, 255, 0.14)');
      glow.addColorStop(1, 'rgba(196, 107, 255, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, 66, 0, Math.PI * 2);
      ctx.fill();

      ctx.rotate(midBoss.age * 1.6);
      ctx.strokeStyle = 'rgba(255, 160, 232, 0.85)';
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 7]);
      ctx.beginPath();
      ctx.arc(0, 0, 35, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();

      const body = ctx.createRadialGradient(-9, -9, 2, 0, 0, 25);
      body.addColorStop(0, '#fff0ff');
      body.addColorStop(0.3, '#ff9be8');
      body.addColorStop(0.72, '#b45cdb');
      body.addColorStop(1, '#3b1046');
      ctx.fillStyle = body;
      ctx.strokeStyle = '#ffc6f2';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, 25, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#2a0d2b';
      ctx.strokeStyle = 'rgba(255, 190, 245, 0.8)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(0, 0, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.save();
      ctx.rotate(-midBoss.age * 2.4);
      ctx.fillStyle = '#ffe3fb';
      ctx.beginPath();
      for (let i = 0; i < 8; i += 1) {
        const angle = (i / 8) * Math.PI * 2;
        const radius = i % 2 === 0 ? 10 : 4;
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      if (midBoss.flash > 0) {
        ctx.globalAlpha *= midBoss.flash;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(0, 0, 25, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function drawStage3FinalBoss() {
      if (!stage3FinalBoss) return;

      const god = stage3FinalBoss;
      const mainColor = god.phase === 1 ? '#5eff8a' : '#ffe66d';

      ctx.save();
      ctx.translate(god.x, god.y);
      ctx.globalAlpha = god.defeated
        ? Math.max(0, 1 - god.deathTimer / 1.8)
        : 1;

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const glow = ctx.createRadialGradient(0, 0, 5, 0, 0, 105);
      glow.addColorStop(0, hexA(mainColor, 0.48));
      glow.addColorStop(0.5, hexA(mainColor, 0.12));
      glow.addColorStop(1, hexA(mainColor, 0));
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, 105, 0, Math.PI * 2);
      ctx.fill();

      ctx.rotate(god.age * 0.7);
      ctx.strokeStyle = hexA(mainColor, 0.8);
      ctx.lineWidth = 1.5;
      ctx.setLineDash([6, 10]);
      ctx.beginPath();
      ctx.arc(0, 0, 52, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();

      ctx.save();
      ctx.rotate(-god.age * 1.1);
      ctx.strokeStyle = hexA(mainColor, 0.5);
      ctx.lineWidth = 1.2;
      for (let i = 0; i < 4; i += 1) {
        const a = (i / 4) * Math.PI * 2;
        ctx.beginPath();
        ctx.arc(0, 0, 63, a, a + 0.55);
        ctx.stroke();
      }
      ctx.restore();

      const body = ctx.createRadialGradient(-12, -14, 4, 0, 0, 36);
      body.addColorStop(0, '#ffffff');
      body.addColorStop(0.25, hexA(mainColor, 0.95));
      body.addColorStop(0.7, god.phase === 1 ? '#185c35' : '#6b5413');
      body.addColorStop(1, '#07120c');
      ctx.fillStyle = body;
      ctx.strokeStyle = mainColor;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, 36, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = 'rgba(3, 12, 8, 0.9)';
      ctx.strokeStyle = hexA(mainColor, 0.8);
      ctx.beginPath();
      ctx.arc(0, 0, 19, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.save();
      ctx.rotate(god.age * 2.4);
      ctx.fillStyle = '#fffbe0';
      ctx.beginPath();
      for (let i = 0; i < 8; i += 1) {
        const angle = (i / 8) * Math.PI * 2;
        const radius = i % 2 === 0 ? 14 : 5;
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = hexA(mainColor, 0.95);
      for (let i = 0; i < 6; i += 1) {
        const angle = god.age * 1.3 + (i / 6) * Math.PI * 2;
        ctx.beginPath();
        ctx.arc(Math.cos(angle) * 46, Math.sin(angle) * 46, 2.3, 0, Math.PI * 2);
        ctx.fill();
      }

      // 四顆環繞陰陽玉子機
      god.orbs.forEach((orb) => {
        const ox = Math.cos(orb.angle) * 92;
        const oy = Math.sin(orb.angle) * 58;
        ctx.save();
        ctx.translate(ox, oy);
        ctx.rotate(orb.angle * 2);

        ctx.fillStyle = 'rgba(5, 10, 18, 0.95)';
        ctx.strokeStyle = mainColor;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(0, 0, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#f7fff9';
        ctx.beginPath();
        ctx.arc(-2.5, -2.5, 2.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#101820';
        ctx.beginPath();
        ctx.arc(2.5, 2.5, 1.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      if (god.flash > 0) {
        ctx.globalAlpha *= god.flash;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(0, 0, 36, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function drawBossHUD() {
      const target = boss || stage2MidBoss || stage3FinalBoss;
      if (!target) return;

      const isGod = Boolean(stage3FinalBoss);
      const isMidBoss = !isGod && !boss && Boolean(stage2MidBoss);
      const barWidth = Math.min(560, width * 0.6);
      const barHeight = 12;
      const x = (width - barWidth) / 2;
      const y = 54;

      ctx.save();
      ctx.fillStyle = 'rgba(5, 8, 16, 0.72)';
      ctx.fillRect(x - 12, y - 18, barWidth + 24, 38);
      ctx.strokeStyle = isGod
        ? 'rgba(94, 255, 138, 0.6)'
        : isMidBoss
          ? 'rgba(255, 123, 213, 0.55)'
          : 'rgba(255, 82, 92, 0.55)';
      ctx.lineWidth = 1;
      ctx.strokeRect(x - 12, y - 18, barWidth + 24, 38);

      ctx.font = 'bold 11px monospace';
      ctx.textAlign = 'left';
      ctx.fillStyle = isGod ? '#b6ff5e' : isMidBoss ? '#ffb7ec' : '#ff9aa5';
      ctx.fillText(isGod ? 'GOD BOSS' : isMidBoss ? 'MID BOSS' : 'BOSS', x, y - 5);

      ctx.textAlign = 'right';
      ctx.fillStyle = isGod ? '#eaffb0' : isMidBoss ? '#ffd9f5' : '#ffccd1';
      ctx.fillText(`${Math.ceil(target.hp)} / ${target.maxHp}`, x + barWidth, y - 5);

      ctx.fillStyle = isGod ? '#102611' : isMidBoss ? '#2b0c31' : '#3a0c13';
      ctx.fillRect(x, y, barWidth, barHeight);

      const ratio = Math.max(0, Math.min(1, target.hp / target.maxHp));
      const gradient = ctx.createLinearGradient(x, 0, x + barWidth, 0);
      if (isGod) {
        gradient.addColorStop(0, '#5eff8a');
        gradient.addColorStop(1, '#ffe66d');
      } else if (isMidBoss) {
        gradient.addColorStop(0, '#ff5fc8');
        gradient.addColorStop(1, '#a76bff');
      } else {
        gradient.addColorStop(0, '#ff2333');
        gradient.addColorStop(1, '#ff8a5b');
      }
      ctx.fillStyle = gradient;
      ctx.fillRect(x, y, barWidth * ratio, barHeight);

      ctx.restore();
    }

    function drawStageClear() {
      const titleSize = Math.min(60, width * 0.09);

      ctx.save();
      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      ctx.fillRect(0, 0, width, height);
      ctx.textAlign = 'center';

      ctx.shadowColor = '#ffd166';
      ctx.shadowBlur = 30;
      ctx.fillStyle = '#ffd166';
      ctx.font = `bold ${titleSize}px monospace`;
      ctx.fillText('Stage 1 Clear!', width / 2, height / 2 - 25);

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 22px monospace';
      ctx.fillText('準備進入 Stage 2', width / 2, height / 2 + 35);

      ctx.fillStyle = '#9aa4b2';
      ctx.font = '14px monospace';
      ctx.fillText('STAGE 2-1 // 自動切換中…', width / 2, height / 2 + 75);

      ctx.fillStyle = '#ff9bd2';
      ctx.font = '13px monospace';
      ctx.fillText(`SCORE ${score}`, width / 2, height / 2 + 115);
      ctx.restore();
    }

    function drawStage3Enter() {
      const titleSize = Math.min(38, width * 0.04);

      ctx.save();
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.fillRect(0, 0, width, height);
      ctx.textAlign = 'center';

      ctx.fillStyle = '#ff4d5e';
      ctx.font = 'bold 16px monospace';
      ctx.fillText('FINAL STAGE', width / 2, height / 2 - 78);

      ctx.shadowColor = '#5eff8a';
      ctx.shadowBlur = 28;
      ctx.fillStyle = '#eafff0';
      ctx.font = `bold ${titleSize}px monospace`;
      ctx.fillText('Entering Final Stage: Lunatic Hell', width / 2, height / 2 - 10);

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#5eff8a';
      ctx.font = 'bold 24px monospace';
      ctx.fillText('STAGE 3-1', width / 2, height / 2 + 50);

      ctx.fillStyle = '#9aa4b2';
      ctx.font = '13px monospace';
      ctx.fillText('地獄瘋狂模式 // NO SAFE SPACE', width / 2, height / 2 + 88);
      ctx.restore();
    }

    function drawStage3Clear() {
      ctx.save();
      ctx.fillStyle = 'rgba(0, 0, 0, 0.68)';
      ctx.fillRect(0, 0, width, height);
      ctx.textAlign = 'center';

      ctx.shadowColor = '#5eff8a';
      ctx.shadowBlur = 30;
      ctx.fillStyle = '#eaffb0';
      ctx.font = `bold ${Math.min(52, width * 0.07)}px monospace`;
      ctx.fillText('LUNATIC HELL CLEAR', width / 2, height / 2 - 10);

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 22px monospace';
      ctx.fillText(`GAME COMPLETE · SCORE ${score}`, width / 2, height / 2 + 48);

      ctx.fillStyle = '#9aa4b2';
      ctx.font = '14px monospace';
      ctx.fillText('按 R 重新開始', width / 2, height / 2 + 88);
      ctx.restore();
    }

    function drawBombEffect() {
      if (bombTimer <= 0) return;

      const fade = Math.min(1, bombTimer);
      const pulse = 0.5 + 0.5 * Math.sin(performance.now() * 0.008);

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.1 * fade;

      const glow = ctx.createRadialGradient(px, py, 0, px, py, BOMB_RADIUS);
      glow.addColorStop(0, 'rgba(255, 230, 109, 0.3)');
      glow.addColorStop(0.7, 'rgba(255, 230, 109, 0.08)');
      glow.addColorStop(1, 'rgba(255, 230, 109, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(px, py, BOMB_RADIUS, 0, Math.PI * 2);
      ctx.fill();

      ctx.globalAlpha = 0.4 + pulse * 0.25;
      ctx.strokeStyle = '#ffe66d';
      ctx.lineWidth = 2;
      ctx.setLineDash([12, 18]);
      ctx.lineDashOffset = -performance.now() * 0.04;
      ctx.beginPath();
      ctx.arc(px, py, BOMB_RADIUS - 2, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }

    function drawHeartIcon(x, y, size, color) {
      ctx.save();
      ctx.translate(x, y);
      const scale = size / 20;
      ctx.scale(scale, scale);
      ctx.beginPath();
      ctx.moveTo(0, 8);
      ctx.bezierCurveTo(-14, -1, -12, -14, 0, -7);
      ctx.bezierCurveTo(12, -14, 14, -1, 0, 8);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      ctx.restore();
    }

    function drawHUD() {
      ctx.save();

      // 分數板
      ctx.font = 'bold 20px monospace';
      ctx.textAlign = 'left';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(`SCORE ${score}`, 20, 34);

      ctx.font = 'bold 12px monospace';
      ctx.fillStyle = '#ffd166';
      const bombLabel = bombTimer > 0
        ? `BOMB × ${bombs}  [E] · ${bombTimer.toFixed(1)}s`
        : `BOMB × ${bombs}  [E]`;
      ctx.fillText(bombLabel, 20, 80);

      // 紅色愛心生命值
      const heartSize = 20;
      const gap = 6;
      const heartsWidth = heartSize * 3 + gap * 2;
      const startX = width - 20 - heartsWidth;

      ctx.font = 'bold 12px monospace';
      ctx.textAlign = 'left';
      ctx.fillStyle = '#9aa4b2';
      ctx.fillText('HP', startX - 30, 32);

      for (let i = 0; i < 3; i += 1) {
        drawHeartIcon(
          startX + i * (heartSize + gap) + heartSize / 2,
          26,
          heartSize,
          i < playerHP ? '#ff3355' : 'rgba(255, 51, 85, 0.2)'
        );
      }

      ctx.restore();
    }

    function drawGameOver() {
      ctx.save();
      ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
      ctx.fillRect(0, 0, width, height);
      ctx.textAlign = 'center';

      ctx.fillStyle = '#ff4d4d';
      ctx.font = 'bold 48px monospace';
      ctx.fillText('GAME OVER', width / 2, height / 2 - 20);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 22px monospace';
      ctx.fillText(`SCORE ${score}`, width / 2, height / 2 + 35);

      ctx.fillStyle = '#9aa4b2';
      ctx.font = '14px monospace';
      ctx.fillText('按 R 重新開始', width / 2, height / 2 + 75);

      ctx.restore();
    }

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // 第一次載入時置中
      if (px === 0 && py === 0) {
        px = width / 2;
        py = height / 2;
      }

      // 避免飛機超出畫面
      px = Math.max(20, Math.min(width - 20, px));
      py = Math.max(20, Math.min(height - 20, py));

      draw();
    }

    window.addEventListener('resize', resize);

    // 滑鼠移動控制飛機位置
    window.addEventListener('pointermove', (event) => {
      const rect = canvas.getBoundingClientRect();

      px = event.clientX - rect.left;
      py = event.clientY - rect.top;

      // 限制在畫面內
      px = Math.max(20, Math.min(width - 20, px));
      py = Math.max(20, Math.min(height - 20, py));

      draw();
    });

    resize();

    // 自動發射與敵機生成
    setInterval(shoot, FIRE_INTERVAL);
    setInterval(spawnEnemy, ENEMY_SPAWN_INTERVAL);
    setInterval(spawnStage3Mob, STAGE3_MOB_INTERVAL);

    let lastTime = performance.now();

    function gameLoop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      updateBackground(dt);

      if (!gameOver && stageClear && stage === 1) {
        stageClearTimer -= dt;
        if (stageClearTimer <= 0) startStage2();
      } else if (!gameOver && stage3Transition) {
        stage3Timer -= dt;
        if (stage3Timer <= 0) startStage3();
      } else if (!gameOver && !stageClear && !stage3Cleared) {
        invincible = Math.max(0, invincible - dt);
        updateBullets(dt);
        updateEnemyBullets(dt);
        updateBombEffect(dt);
        updateEnemies(dt);
        updateBoss(dt);
        updateStage2MidBoss(dt);
        updateStage3FinalBoss(dt);
        updateBossLasers(dt);
        isGrazing = false;
        checkCollisions();
        checkBossCollision();
        checkStage2MidBossCollision();
        checkStage3FinalBossCollision();
        checkPlayerCollision();
        checkEnemyBulletCollision();
        checkBossLaserCollision();
        updateGraze(dt);
        checkBossTrigger();
        updateStage2Flow(dt);
        updateStage3Flow(dt);
      }

      updateExplosions(dt);
      draw();

      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', (event) => {
      if (event.repeat) return;

      const key = event.key.toLowerCase();

      if (key === 'e') {
        useBomb();
        return;
      }

      if (key === 'i') {
        godMode = !godMode;
      }

      if ((gameOver || stageClear || stage3Cleared) && key === 'r') {
        location.reload();
      }
    });

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
